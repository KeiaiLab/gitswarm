[project]
name = "gitswarm"
version = "0.1.0"
description = "Git coordination layer for concurrent LLM agents — isolated workspaces over any git remote"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KeiaiLab" }]
dependencies = [
    "typer>=0.27,<1",
    "fastmcp>=2",
    "httpx>=0.27",
    "python-ulid>=2",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
gitswarm = "gitswarm.surfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitswarm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
"src/gitswarm/errors.py" = ["N818"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.11"

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
    "pytest>=9,<10",
    "pytest-cov>=6",
    "respx>=0.21",
    "vulture>=2.14",
    "hypothesis>=6.100",
]

[tool.coverage.run]
source = ["gitswarm"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# 기본 `pragma: no cover` 패턴까지 끈다 — 제외 0, 100% 는 진짜 100% 다
exclude_lines = []
exclude_also = []
